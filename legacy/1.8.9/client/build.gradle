import java.util.jar.JarFile
import java.security.MessageDigest
import org.gradle.api.tasks.compile.JavaCompile

buildscript {
    configurations.classpath {
        // ForgeGradle 2.1.3 has one historic SNAPSHOT dependency. Its bytes
        // are checked below and this cache must never silently refresh it.
        resolutionStrategy.cacheChangingModulesFor 36500, 'days'
    }
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1.3'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

def opusToolchain = new Properties()
file('toolchain.lock').withInputStream { stream -> opusToolchain.load(stream) }

def opusSha256 = { File artifact ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { stream ->
        byte[] buffer = new byte[16 * 1024]
        int count
        while ((count = stream.read(buffer)) >= 0) {
            if (count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }
    digest.digest().collect { byte value -> String.format('%02x', value & 0xff) }.join()
}

def opusExpectedHash = { String key ->
    def expected = opusToolchain.getProperty(key)
    if (expected == null || !expected.matches('[0-9a-f]{64}')) {
        throw new GradleException("Missing or invalid ${key} in toolchain.lock")
    }
    expected
}

