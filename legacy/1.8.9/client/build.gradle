import java.util.jar.JarFile
import java.security.MessageDigest
import org.gradle.api.tasks.compile.JavaCompile

buildscript {
    configurations.classpath {
        // ForgeGradle 2.1.3 has one historic SNAPSHOT dependency. Its bytes
        // are checked below and this cache must never silently refresh it.
        resolutionStrategy.cacheChangingModulesFor 36500, 'days'
    }
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1.3'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

def opusToolchain = new Properties()
file('toolchain.lock').withInputStream { stream -> opusToolchain.load(stream) }

def opusSha256 = { File artifact ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { stream ->
        byte[] buffer = new byte[16 * 1024]
        int count
        while ((count = stream.read(buffer)) >= 0) {
            if (count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }
    digest.digest().collect { byte value -> String.format('%02x', value & 0xff) }.join()
}

def opusExpectedHash = { String key ->
    def expected = opusToolchain.getProperty(key)
    if (expected == null || !expected.matches('[0-9a-f]{64}')) {
        throw new GradleException("Missing or invalid ${key} in toolchain.lock")
    }
    expected
}

version = '0.0.1-preview.3'
group = 'org.polydevs.opusmc'
archivesBaseName = 'opus-forge-client'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    mappings = 'stable_22'
    runDir = 'run'
}

def opusJavac = System.getenv('OPUS_FORGE_UI_JAVAC')
if (opusJavac == null || opusJavac.trim().isEmpty()) {
    throw new GradleException('OPUS_FORGE_UI_JAVAC must identify the compiler for this legacy build lane.')
}
def opusJavacFile = file(opusJavac)
if (!opusJavacFile.isFile() || !opusJavacFile.canExecute()) {
    throw new GradleException("OPUS_FORGE_UI_JAVAC is not executable: ${opusJavacFile}")
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.executable = opusJavacFile.absolutePath
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Opus Forge Client Mod',
            'Implementation-Version': project.version
        )
    }
}

task verifyToolchainInputs {
    group = 'verification'
    description = 'Checks the pinned ForgeGradle artifacts in the isolated legacy cache.'
    doLast {
        def artifacts = buildscript.configurations.classpath.resolvedConfiguration.resolvedArtifacts
        def forgeGradle = artifacts.find {
            it.moduleVersion.id.group == 'net.minecraftforge.gradle' && it.name == 'ForgeGradle' && it.moduleVersion.id.version == '2.1.3'
        }
        if (forgeGradle == null) {
            throw new GradleException('Pinned ForgeGradle 2.1.3 was not resolved.')
        }
        if (opusSha256(forgeGradle.file) != opusExpectedHash('forgegradle.jar.sha256')) {
            throw new GradleException('ForgeGradle 2.1.3 bytes did not match toolchain.lock.')
        }

        def fernflower = artifacts.find {
            it.moduleVersion.id.group == 'net.minecraftforge' && it.name == 'fernflower' && it.moduleVersion.id.version == '2.0-SNAPSHOT'
        }
        if (fernflower == null) {
            throw new GradleException('Pinned ForgeGradle fernflower dependency was not resolved.')
        }
        if (opusSha256(fernflower.file) != opusExpectedHash('forgegradle.fernflower.jar.sha256')) {
            throw new GradleException('ForgeGradle fernflower bytes did not match toolchain.lock.')
        }

        def unexpectedSnapshots = artifacts.findAll {
            it.moduleVersion.id.version.endsWith('-SNAPSHOT') && it != fernflower
        }
        if (!unexpectedSnapshots.isEmpty()) {
            throw new GradleException("Unexpected changing build dependencies: ${unexpectedSnapshots}")
        }
    }
}

/**
 * Prove the result is a normal FML client mod after ForgeGradle's
 * reobfuscation. The verification guards the typed UI path against quietly
 * falling back to a coremod package.
 */
task verifyClientArtifact(dependsOn: ['reobfJar', 'verifyToolchainInputs']) {
    group = 'verification'
    description = 'Verifies the reobfuscated, non-coremod Opus Forge client artifact.'
    doLast {
        def artifact = tasks.jar.archivePath
        if (!artifact.isFile()) {
            throw new GradleException("Expected the reobfuscated client-mod JAR at ${artifact}")
        }

        JarFile archive = new JarFile(artifact)
        try {
            if (archive.getEntry('org/polydevs/opusmc/client/OpusClientMod.class') == null) {
                throw new GradleException('Client-mod entry class is missing from the artifact.')
            }
            for (className in [
                    'org/polydevs/opusmc/client/ClientOverlayController.class',
                    'org/polydevs/opusmc/client/OpusClientScreen.class',
                    'org/polydevs/opusmc/client/OpusPreviewPauseMenu.class',
                    'org/polydevs/opusmc/client/OpusMainMenuPage.class',
                    'org/polydevs/opusmc/client/OpusHudEditorPage.class',
                    'org/polydevs/opusmc/client/OpusPanelPage.class',
                    'org/polydevs/opusmc/client/OpusModHubPage.class',
                    'org/polydevs/opusmc/client/OpusPerformanceDetailPage.class',
                    'org/polydevs/opusmc/client/OpusArmorStatusDetailPage.class',
                    'org/polydevs/opusmc/client/FpsModule.class',
                    'org/polydevs/opusmc/client/ArmorStatusModule.class',
                    'org/polydevs/opusmc/client/ArmorStatusSettings.class',
                    'org/polydevs/opusmc/client/UtilitySettingsStore.class',
                    'org/polydevs/opusmc/client/UiTheme.class',
                    'org/polydevs/opusmc/client/UiThemeStore.class',
                    'org/polydevs/opusmc/client/UiPreviewSpec.class',
                    'org/polydevs/opusmc/client/UiPreviewSession.class',
                    'org/polydevs/opusmc/client/ui/UiRuntime.class',
                    'org/polydevs/opusmc/client/ui/UiFontWeight.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftBlurBackdrop.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftUiFont.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftUiScale.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftUiRenderer.class',
                    'org/polydevs/opusmc/client/hud/HudManager.class',
                    'org/polydevs/opusmc/client/module/ModuleRegistry.class']) {
                if (archive.getEntry(className) == null) {
                    throw new GradleException("Typed client surface class is missing from the artifact: ${className}")
                }
            }
            def metadata = archive.getEntry('mcmod.info')
            if (metadata == null) {
                throw new GradleException('FML metadata is missing from the artifact.')
            }
            def metadataText = archive.getInputStream(metadata).getText('UTF-8')
            if (!metadataText.contains('"modid": "opusclient"')) {
                throw new GradleException('FML metadata does not declare the Opus client mod id.')
            }
            def manifest = archive.manifest.mainAttributes
            if (manifest.getValue('FMLCorePlugin') != null
                    || manifest.getValue('FMLCorePluginContainsFMLMod') != null) {
                throw new GradleException('The client mod must not be packaged as a coremod.')
            }
        } finally {
            archive.close()
        }
    }
}

check.dependsOn verifyClientArtifact

/**
 * Runs the real Forge client at a reviewable desktop resolution. The UI is
 * still rendered solely by Minecraft; these files merely drive route/input
 * commands and hot-reload visual tokens during local development.
 */
def opusUiPreviewRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName == 'runUiPreview' || taskName.endsWith(':runUiPreview')
}

if (opusUiPreviewRequested) {
    def opusProcessGuard = file('../../../../tools/process-guard.sh').absolutePath
    def opusPreviewControl = file('preview/opus-ui-preview.json').absolutePath
    def opusPreviewTheme = file('preview/opus-ui-theme.json').absolutePath
    def opusPreviewUtilitySettings = file('preview/opus-utility-settings.json').absolutePath
    tasks.getByName('runClient').jvmArgs(
            "-Dopus.ui.preview.control.file=${opusPreviewControl}",
            "-Dopus.ui.preview.theme.file=${opusPreviewTheme}",
            "-Dopus.utility.settings.file=${opusPreviewUtilitySettings}")
    // Keep the same native renderer reviewable at more than one desktop
    // size; this is a launch override rather than a second preview layout.
    def opusPreviewWidth = (findProperty('opusPreviewWidth') ?: '1440').toString()
    def opusPreviewHeight = (findProperty('opusPreviewHeight') ?: '900').toString()
    if (!opusPreviewWidth.matches('^[1-9][0-9]{2,3}$') || !opusPreviewHeight.matches('^[1-9][0-9]{2,3}$')) {
        throw new GradleException('opusPreviewWidth and opusPreviewHeight must be positive pixel dimensions.')
    }
    tasks.getByName('runClient').args('--width', opusPreviewWidth, '--height', opusPreviewHeight)

    // Preview renders a real Forge process. Keep a PID lock beside the
    // controls so an interrupted review cannot quietly accumulate clients.
    def opusPreviewLock = file('preview/.opus-ui-preview.lock')
    tasks.getByName('runClient').doFirst {
        def guard = [opusProcessGuard, 'assert-idle'].execute()
        guard.consumeProcessOutput(System.out, System.err)
        if (guard.waitFor() != 0) {
            throw new GradleException('Opus process guard rejected this preview launch.')
        }
        if (opusPreviewLock.isFile()) {
            def previousPid = opusPreviewLock.text.trim()
            def active = false
            if (previousPid ==~ /^[0-9]+$/) {
                active = ['sh', '-c', "kill -0 ${previousPid} 2>/dev/null"].execute().waitFor() == 0
            }
            if (active) {
                throw new GradleException("Opus UI Preview is already running (pid ${previousPid}). Stop it before opening another preview.")
            }
            opusPreviewLock.delete()
        }
        opusPreviewLock.parentFile.mkdirs()
        opusPreviewLock.text = java.lang.management.ManagementFactory.runtimeMXBean.name.split('@')[0] + '\\n'
    }
    tasks.getByName('runClient').doLast {
        if (opusPreviewLock.isFile()) {
            opusPreviewLock.delete()
        }
    }
    tasks.getByName('runClient').finalizedBy('clearUiPreviewLock')
    task clearUiPreviewLock {
        doLast {
            if (opusPreviewLock.isFile()) {
                opusPreviewLock.delete()
            }
        }
    }
}

task runUiPreview(dependsOn: 'runClient') {
    group = 'opus'
    description = 'Runs the real Forge client with Opus Preview Mode enabled.'
}
