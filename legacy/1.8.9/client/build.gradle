def opusCefHelperDir = file('native/opus-cef-helper')
def opusCefHelperApp = file("${opusCefHelperDir}/build/opus-webview-helper.app")
def opusCefHelperHarnessApp = file(System.getenv('OPUS_CEF_HELPER_APP') ?: opusCefHelperApp)
def opusCefLock = new groovy.json.JsonSlurper().parse(file('../../../web-surface-v2/cef-lock.json'))
def opusCefV2Cache = file(System.getenv('OPUS_CEF_V2_CACHE')
        ?: "${System.getProperty('user.home')}/.cache/opus-cef-v2")
def opusCefLockedRoot = new File(
        opusCefV2Cache,
        "dist/${opusCefLock.file.toString().replace('_macosarm64.tar.bz2', '_macosarm64')}")
// CEF V2 owns a versioned, checksum-pinned cache. Prefer it over the retired
// ~/.cache/opus-cef/current convention so a normal runtime/desktop build also
// rebuilds the helper when its native source changes.
def opusCefRoot = file(System.getenv('CEF_ROOT')
        ?: System.getenv('OPUS_CEF_ROOT')
        ?: (opusCefLockedRoot.isDirectory()
                ? opusCefLockedRoot.absolutePath
                : opusCefV2Cache))
def opusIsMac = System.getProperty('os.name', '').toLowerCase().contains('mac')

/**
 * Builds the out-of-process CEF helper: it renders the Opus web UI offscreen
 * (windowless/OSR) and publishes BGRA frames through a shared memory-mapped
 * file, which the game uploads to an in-game OpenGL texture.
 *
 * Deliberately NOT bundled into the mod jar. The .app carries the ~500 MB
 * Chromium framework plus five subprocess bundles, so it is built in place and
 * located on disk at runtime (see OpusWebViewClient.resolveHelperPath).
 *
 * Fails closed when the locked CEF distribution is missing; a product check
 * must not pass with the embedded surface unavailable. Helper construction is
 * macOS-only.
 */
task buildWebViewHelper(type: Exec) {
    description = 'Builds the macOS Opus CEF helper (offscreen browser -> shared memory).'
    group = 'build'
    def cefFramework = new File(opusCefRoot, 'Release/Chromium Embedded Framework.framework')
    onlyIf {
        if (!opusIsMac || !opusCefHelperDir.isDirectory()) {
            return false
        }
        if (!cefFramework.isDirectory()) {
            throw new GradleException("Locked CEF distribution is missing: ${cefFramework}")
        }
        return true
    }
    workingDir opusCefHelperDir
    commandLine 'bash', 'build.sh'
    environment 'CEF_ROOT', opusCefRoot.absolutePath
    inputs.dir("${opusCefHelperDir}/src")
    inputs.file("${opusCefHelperDir}/build.sh")
    // Only the main binary is tracked as output, not the whole bundle: snapshotting
    // the copied Chromium framework on every build would cost seconds for nothing,
    // and the binary living inside the .app is enough to detect a wiped bundle.
    outputs.file new File(opusCefHelperApp, 'Contents/MacOS/opus-webview-helper')
}

