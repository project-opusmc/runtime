task verifyToolchainInputs {
    group = 'verification'
    description = 'Checks the pinned ForgeGradle artifacts in the isolated legacy cache.'
    doLast {
        def artifacts = buildscript.configurations.classpath.resolvedConfiguration.resolvedArtifacts
        def forgeGradle = artifacts.find {
            it.moduleVersion.id.group == 'net.minecraftforge.gradle' && it.name == 'ForgeGradle' && it.moduleVersion.id.version == '2.1.3'
        }
        if (forgeGradle == null) {
            throw new GradleException('Pinned ForgeGradle 2.1.3 was not resolved.')
        }
        if (opusSha256(forgeGradle.file) != opusExpectedHash('forgegradle.jar.sha256')) {
            throw new GradleException('ForgeGradle 2.1.3 bytes did not match toolchain.lock.')
        }

        def fernflower = artifacts.find {
            it.moduleVersion.id.group == 'net.minecraftforge' && it.name == 'fernflower' && it.moduleVersion.id.version == '2.0-SNAPSHOT'
        }
        if (fernflower == null) {
            throw new GradleException('Pinned ForgeGradle fernflower dependency was not resolved.')
        }
        if (opusSha256(fernflower.file) != opusExpectedHash('forgegradle.fernflower.jar.sha256')) {
            throw new GradleException('ForgeGradle fernflower bytes did not match toolchain.lock.')
        }

        def unexpectedSnapshots = artifacts.findAll {
            it.moduleVersion.id.version.endsWith('-SNAPSHOT') && it != fernflower
        }
        if (!unexpectedSnapshots.isEmpty()) {
            throw new GradleException("Unexpected changing build dependencies: ${unexpectedSnapshots}")
        }
    }
}

/**
 * Keep the retired native product surface out of every Runtime Java source
 * set as well as out of the final JAR. The artifact verifier catches stale
 * compiled outputs, while this source gate catches an accidental
 * re-introduction before an incremental build can make that output look
 * authoritative.
 */
task verifyRetiredUiSources {
    group = 'verification'
    description = 'Rejects reintroduced T-UI/native product source files and references.'
    doLast {
        def retiredNames = [
                'UiRuntime',
                'OpusUiPageFactory',
                'OpusVanillaTerminalOverlay',
                'ClientConfigUi',
                'ClientUiHooks',
                'OpusExternalBrowser',
                'OpusVirtualScreenManager',
                'UiTheme',
                'UiThemeStore',
                'UiPage',
                'UiPageAdapter',
                'UiComponent',
                'UiContainer',
                'UiActionButton',
                'UiHomeActionCard',
                'UiHomeNavButton',
                'UiHomePrimaryAction',
                'UiHomeUtilityLink',
                'UiLunarMenuButton',
                'UiLayout',
                'UiColumn',
                'UiRow',
                'UiStack',
                'MinecraftUiFont',
                'MinecraftBlurBackdrop',
                'MinecraftMonoFont',
                'MinecraftTitlePanorama',
                'OpusBootTerminal',
                'BootTerminalTransformer',
                'LoadingTerminalTransformer',
                'ClientOptionsTransformer',
                'OpusClientOptionsScreenFactory',
        ]
        def sourceRoots = [
                file('src/main/java'),
                file('../../../common/src/main/java'),
                file('../forge/src/main/java'),
                file('../patches/src/main/java'),
        ].findAll { it.isDirectory() }
        def sourceFiles = sourceRoots.collectMany { root ->
            fileTree(root) {
                include '**/*.java'
            }.files
        }
        def retiredPackageFragments = [
                '/org/polydevs/opusmc/client/ui/component/',
                '/org/polydevs/opusmc/client/ui/layout/',
                '/org/polydevs/opusmc/client/gui/',
        ]
        def pathViolations = sourceFiles.findAll { file ->
            def normalizedPath = file.path.replace(File.separator, "/")
            retiredNames.any { name ->
                (file.name == "${name}.java"
                        || file.name.startsWith("${name}\$")
                        || file.name ==~ /Opus.*Page(?:\$.*)?\.java/
                        || retiredPackageFragments.any { fragment ->
                            normalizedPath.contains(fragment)
                        })
            }
        }
        def tokenViolations = []
        sourceFiles.each { file ->
            file.eachLine { line, lineNumber ->
                retiredNames.each { name ->
                    if (line.contains(name)) {
                        tokenViolations.add("${file}:${lineNumber}: ${name}")
                    }
                }
                if (line ==~ /.*\bOpus[A-Za-z0-9_]*Page\b.*/) {
                    tokenViolations.add("${file}:${lineNumber}: Opus*Page")
                }
            }
        }
        if (!pathViolations.isEmpty() || !tokenViolations.isEmpty()) {
            def details = (pathViolations.collect { it.path } + tokenViolations).unique()
            throw new GradleException(
                    "Retired native product UI source is present: ${details.join(', ')}")
        }
    }
}

/**
 * Prove the result is a normal FML client mod after ForgeGradle's
 * reobfuscation. The verification guards the typed UI path against quietly
 * falling back to a coremod package.
 */
task verifyClientArtifact(dependsOn: ['reobfJar', 'verifyToolchainInputs', 'verifyRetiredUiSources', 'harnessPauseShaderAccess']) {
    group = 'verification'
    description = 'Verifies the reobfuscated, non-coremod Opus Forge client artifact.'
    doLast {
        def artifact = tasks.jar.archivePath
        if (!artifact.isFile()) {
            throw new GradleException("Expected the reobfuscated client-mod JAR at ${artifact}")
        }

        JarFile archive = new JarFile(artifact)
        try {
            if (archive.getEntry('org/polydevs/opusmc/client/OpusClientMod.class') == null) {
                throw new GradleException('Client-mod entry class is missing from the artifact.')
            }
            for (className in [
                    'org/polydevs/opusmc/client/ClientOverlayController.class',
                    'org/polydevs/opusmc/client/OpusClientScreen.class',
                    'org/polydevs/opusmc/client/OpusPreviewPauseMenu.class',
                    'org/polydevs/opusmc/client/interop/OpusInteropServer.class',
                    'org/polydevs/opusmc/client/interop/OpusWebSocket.class',
                    'org/polydevs/opusmc/client/interop/UiNavigationManager.class',
                    'org/polydevs/opusmc/client/interop/OpusJson.class',
                    'org/polydevs/opusmc/client/FpsModule.class',
                    'org/polydevs/opusmc/client/ArmorStatusModule.class',
                    'org/polydevs/opusmc/client/ArmorStatusSettings.class',
                    'org/polydevs/opusmc/client/UtilitySettingsStore.class',
                    'org/polydevs/opusmc/client/UiPreviewSpec.class',
                    'org/polydevs/opusmc/client/UiPreviewSession.class',
                    'org/polydevs/opusmc/client/embed/OpusWebViewClient.class',
                    'org/polydevs/opusmc/client/embed/OpusWebTextureSurface.class',
                    'org/polydevs/opusmc/client/ui/UiBounds.class',
                    'org/polydevs/opusmc/client/ui/UiInput.class',
                    'org/polydevs/opusmc/client/ui/UiNavigationState.class',
                    'org/polydevs/opusmc/client/ui/UiRoute.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftUiScale.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftUiRenderer.class',
                    'org/polydevs/opusmc/client/hud/HudManager.class',
                    'org/polydevs/opusmc/client/module/ModuleRegistry.class']) {
                if (archive.getEntry(className) == null) {
                    throw new GradleException("Typed client surface class is missing from the artifact: ${className}")
                }
            }
            for (retiredEntry in [
                    'org/polydevs/opusmc/client/interop/OpusExternalBrowser.class',
                    'org/polydevs/opusmc/core/ClientConfigUi.class',
                    'org/polydevs/opusmc/core/ClientUiHooks.class',
                    'org/polydevs/opusmc/client/OpusVanillaTerminalOverlay.class',
                    'org/polydevs/opusmc/client/OpusUiPageFactory.class',
                    'org/polydevs/opusmc/client/interop/OpusVirtualScreenManager.class',
                    'org/polydevs/opusmc/client/UiTheme.class',
                    'org/polydevs/opusmc/client/UiThemeStore.class',
                    'org/polydevs/opusmc/client/ui/UiRuntime.class',
                    'org/polydevs/opusmc/client/ui/UiFontWeight.class',
                    'org/polydevs/opusmc/client/ui/UiPage.class',
                    'org/polydevs/opusmc/client/ui/UiPageAdapter.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftBlurBackdrop.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftMonoFont.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftTitlePanorama.class',
                    'org/polydevs/opusmc/client/ui/render/MinecraftUiFont.class',
                    'assets/opusclient/shaders/post/opus_blur.json',
                    'assets/minecraft/shaders/program/opus_blur.json',
                    'assets/opusclient/textures/gui/opus-wordmark-transparent.png',
                    'META-INF/services/org.polydevs.opusmc.bootstrap.ClassTransformer']) {
                if (archive.getEntry(retiredEntry) != null) {
                    throw new GradleException("Retired parallel UI entry leaked into the artifact: ${retiredEntry}")
                }
            }
            def leakedLegacyUi = []
            def entries = archive.entries()
            while (entries.hasMoreElements()) {
                def entryName = entries.nextElement().name
                if (entryName.endsWith('.class')
                        && ((entryName ==~ /org\/polydevs\/opusmc\/client\/Opus.*Page(?:\$.*)?\.class/)
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/component/')
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/layout/')
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/UiPage')
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/UiRuntime')
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/UiFontWeight')
                        || entryName.startsWith('org/polydevs/opusmc/client/UiTheme')
                        || entryName.startsWith('org/polydevs/opusmc/client/interop/OpusVirtualScreenManager')
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/render/MinecraftBlurBackdrop')
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/render/MinecraftMonoFont')
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/render/MinecraftTitlePanorama')
                        || entryName.startsWith('org/polydevs/opusmc/client/ui/render/MinecraftUiFont')
                        || entryName.startsWith('org/polydevs/opusmc/core/ClientConfigUi')
                        || entryName.startsWith('org/polydevs/opusmc/core/ClientUiHooks')
                        || entryName.startsWith('org/polydevs/opusmc/patches/ClientOptionsTransformer')
                        || entryName.startsWith('org/polydevs/opusmc/patches/OpusClientOptionsScreenFactory')
                        || entryName.startsWith('org/polydevs/opusmc/client/OpusVanillaTerminalOverlay')
                        || entryName.startsWith('org/polydevs/opusmc/client/interop/OpusExternalBrowser')
                        || entryName.startsWith('org/polydevs/opusmc/client/gui/'))) {
                    leakedLegacyUi.add(entryName)
                }
            }
            if (!leakedLegacyUi.isEmpty()) {
                throw new GradleException(
                        "Retired parallel UI classes leaked into the artifact: ${leakedLegacyUi}")
            }
            def metadata = archive.getEntry('mcmod.info')
            if (metadata == null) {
                throw new GradleException('FML metadata is missing from the artifact.')
            }
            if (archive.getEntry('opusui/index.html') == null) {
                throw new GradleException('Opus web UI bundle is missing from the artifact.')
            }
            def metadataText = archive.getInputStream(metadata).getText('UTF-8')
            if (!metadataText.contains('"modid": "opusclient"')) {
                throw new GradleException('FML metadata does not declare the Opus client mod id.')
            }
            def manifest = archive.manifest.mainAttributes
            if (manifest.getValue('FMLCorePlugin') != null
                    || manifest.getValue('FMLCorePluginContainsFMLMod') != null) {
                throw new GradleException('The client mod must not be packaged as a coremod.')
            }
        } finally {
            archive.close()
        }
    }
}

